name: Build AYOSO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil file proyek
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ekstrak proyek AYOSO
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "File ZIP proyek tidak ditemukan"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d source
          test -f source/ayoso/package.json
          echo "PROJECT_DIR=source/ayoso" >> "$GITHUB_ENV"

      - name: Instal dependensi
        run: npm install
        working-directory: source/ayoso

      - name: Tambahkan Android
        run: npx cap add android
        working-directory: source/ayoso

      - name: Konfigurasi Android
        run: python3 scripts/patch_android.py
        working-directory: source/ayoso

      - name: Sinkronisasi aplikasi
        run: npx cap sync android
        working-directory: source/ayoso

      - name: Bangun APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: source/ayoso

      - name: Siapkan APK
        run: |
          cp source/ayoso/android/app/build/outputs/apk/debug/app-debug.apk AYOSO.apk

      - name: Simpan APK untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: AYOSO-APK
          path: AYOSO.apk
          if-no-files-found: error
